    <link href="https://fonts.cdnfonts.com/css/dedicool" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Dedicool', sans-serif;
            background-color: #FF69B4;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .tekst{
            position: absolute;
            top:450px;
        }

        .container {

            position: relative;
        }

        .button {
            background-color: #fbeee0;
            border: 2px solid #422800;
            border-radius: 30px;
            box-shadow: #422800 4px 4px 0 0;
            color: #422800;
            cursor: pointer;
            font-weight: 600;
            font-size: 18px;
            padding: 0 18px;
            line-height: 50px;
            text-align: center;
            text-decoration: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            margin-top: 50px; /* Adjusted for responsiveness */
        }

        .dupa {
            display: flex;
            flex-direction: column;
        }

        .images {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .gif {
            -webkit-animation: spin 2s linear infinite;
            -moz-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }
        @-moz-keyframes spin {
            100% {
                -moz-transform: rotate(360deg);
            }
        }

        @-webkit-keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            100% {
                -webkit-transform: rotate(360deg);
                transform: rotate(360deg);
            }


        .images img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        @media (max-width: 800px) {
            .button {
                line-height: 40px; /* Adjusted for smaller screens */
                font-size: 14px; /* Adjusted for smaller screens */
            }
        }


    </style>
</head>
